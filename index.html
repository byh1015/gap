<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GapUp Screener</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#0b1020;color:#e6e9f2}
header{padding:12px 16px;border-bottom:1px solid #1d2542;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0}
button{font:inherit;font-size:12.5px;font-weight:700;color:#b7c3e6;background:#161e33;border:1px solid #2a335c;padding:6px 10px;border-radius:8px;cursor:pointer}
button.active{color:#fff;border-color:#5b8bff}
.list{display:flex;flex-direction:column;gap:8px;padding:12px 16px}
.row{display:flex;gap:12px;align-items:center;background:#12182a;border:1px solid #20284a;padding:10px 12px;border-radius:10px}
.row.hide{display:none}
.meta{display:flex;gap:8px;align-items:center}
.name{font-weight:700}
.sub{color:#9aa3c7;font-size:12px}
.val{margin-left:auto;color:#c9d1ff}
details.nws{padding:0 16px 16px}
</style>
</head>
<body>
<header>
<h1>GapUp</h1>
<button id="filtnxt" type="button">NXT만</button>
<button id="sortval" type="button">거래대금순</button>
<button id="upd" type="button">새로고침</button>
</header>
<div class="list" id="list"></div>
<details class="nws"><summary>뉴스</summary><div id="news"></div></details>
<script>
const data=[];
function render(){
  const list=document.getElementById('list');
  list.innerHTML='';
  let items=[...data];
  const snxt=localStorage.getItem('gap_nxt')==='1';
  if(snxt){items=items.filter(x=>x.nxt);}
  const sval=localStorage.getItem('gap_sort')==='val';
  if(sval){items.sort((a,b)=>(b.valn||0)-(a.valn||0));}
  for(const it of items){
    const r=document.createElement('div');
    r.className='row'; if(it.nxt) r.dataset.nxt='1'; r.dataset.val=it.valn||0;
    r.innerHTML='<div class="meta"><div class="name">'+it.name+'</div><div class="sub">'+it.code+'</div></div><div class="val">'+(it.val||'')+'</div>';
    list.appendChild(r);
  }
}
document.getElementById('filtnxt').onclick=function(){
  const v=localStorage.getItem('gap_nxt')==='1';
  if(v){localStorage.removeItem('gap_nxt'); this.classList.remove('active');}
  else{localStorage.setItem('gap_nxt','1'); this.classList.add('active');}
  render();
};
document.getElementById('sortval').onclick=function(){
  const v=localStorage.getItem('gap_sort')==='val';
  if(v){localStorage.removeItem('gap_sort'); this.textContent='거래대금순'; this.classList.remove('active');}
  else{localStorage.setItem('gap_sort','val'); this.textContent='점수순'; this.classList.add('active');}
  render();
};
document.getElementById('upd').onclick=function(){location.reload();};
if(localStorage.getItem('gap_nxt')==='1') document.getElementById('filtnxt').classList.add('active');
if(localStorage.getItem('gap_sort')==='val'){document.getElementById('sortval').classList.add('active'); document.getElementById('sortval').textContent='점수순';}
render();
</script>
</body>
</html>
