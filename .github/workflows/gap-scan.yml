name: gap-scan

on:
  schedule:
    # 매 평일 09:00 UTC (18:00 KST) — 장 마감 후
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner
        env:
          GAP_HERE: ${{ github.workspace }}
          GAP_HTML: ${{ github.workspace }}/index.html
          GAP_NO_PUSH: "1"
          PYTHONIOENCODING: utf-8
        run: python gap_today.py

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html gap_all_meta.json 2>/dev/null || git add index.html
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
